[package]
name = "desktop-design-system"
version = "0.2.1"
edition = "2021"
description = "High-performance native desktop design system, component library, and turnkey CRUD template built with Rust and Slint."
license = "MIT"
repository = "https://github.com/khank8476/desktop-design-system-rust-slint"
homepage = "https://github.com/khank8476/desktop-design-system-rust-slint"
readme = "README.md"
keywords = ["design-system", "slint", "gui", "desktop", "crud"]
categories = ["gui", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "desktop-design-system"
path = "src/main.rs"

[dependencies]
slint = "1.9"
dark-light = "1.1"
rusqlite = { version = "0.31", features = ["bundled"] }
sysinfo = "0.40.0"
mslnk = "0.1.8"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.10.1"

[build-dependencies]
slint-build = "1.9"

[profile.release]
opt-level = "z"      # Optimize for small binary size
lto = true           # Link Time Optimization (cross-crate inlining & dead code removal)
codegen-units = 1    # Enables maximum LTO optimizations
strip = true         # Strips all debug symbols from the .exe
panic = "abort"      # Strips unnecessary panic unwinding tables

